# Default values, override with equivalent ENV var.
# !!!-- Update with precaution --!!!
otel.service.name=wegas
otel.exporter.otlp.endpoint=http://localhost:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=none

# Gauge/counter sampling period for the wegas.* instruments (this is also the SDK default).
otel.metric.export.interval=60000
